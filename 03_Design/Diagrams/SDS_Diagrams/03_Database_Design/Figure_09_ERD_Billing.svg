<text x="87" y="186" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">RetreatBooking (M2)</text>
<text x="90" y="238" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK retreat_booking_id INT</text>
<text x="90" y="272" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">booking / deposit context</text>
<rect x="680" y="155" width="535" height="260" rx="8" fill="#FFFFFF" stroke="#4F6F8F" stroke-width="3"/>
<rect x="680" y="155" width="535" height="48" fill="#173B63"/>
<text x="692" y="186" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">Folio</text>
<text x="695" y="238" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK folio_id INT</text>
<text x="695" y="272" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">FK retreat_booking_id INT</text>
<text x="695" y="306" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">computed persisted balance_due</text>
<text x="695" y="340" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">folio_status CHECK</text>
<rect x="1285" y="155" width="535" height="260" rx="8" fill="#FFFFFF" stroke="#4F6F8F" stroke-width="3"/>
<rect x="1285" y="155" width="535" height="48" fill="#173B63"/>
<text x="1297" y="186" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">FolioItem</text>
<text x="1300" y="238" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK folio_item_id INT</text>
<text x="1300" y="272" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">FK folio_id INT</text>
<text x="1300" y="306" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">source_booking_id INT NULL</text>
<text x="1300" y="340" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">source_spa_session_id INT NULL</text>
<text x="1300" y="374" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">source_meal_order_id INT NULL</text>
<rect x="75" y="470" width="535" height="260" rx="8" fill="#FFFFFF" stroke="#4F6F8F" stroke-width="3"/>
<rect x="75" y="470" width="535" height="48" fill="#173B63"/>
<text x="87" y="501" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">Invoice</text>
<text x="90" y="553" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK invoice_id INT</text>
<text x="90" y="587" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">FK folio_id INT UNIQUE</text>
<text x="90" y="621" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">final_amount DECIMAL(18,2)</text>
<text x="90" y="655" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">invoice_status CHECK</text>
<rect x="680" y="470" width="535" height="260" rx="8" fill="#FFFFFF" stroke="#4F6F8F" stroke-width="3"/>
<rect x="680" y="470" width="535" height="48" fill="#173B63"/>
<text x="692" y="501" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">PaymentTransaction</text>
<text x="695" y="553" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK transaction_id INT</text>
<text x="695" y="587" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">retreat_booking_id INT NULL</text>
<text x="695" y="621" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">invoice_id INT NULL</text>
<text x="695" y="655" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">payment_type/status CHECK</text>
<rect x="1285" y="470" width="535" height="260" rx="8" fill="#FFFFFF" stroke="#4F6F8F" stroke-width="3"/>
<rect x="1285" y="470" width="535" height="48" fill="#173B63"/>
<text x="1297" y="501" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">AdjustmentRequest</text>
<text x="1300" y="553" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK adjustment_request_id INT</text>
<text x="1300" y="587" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">FK folio_item_id / folio_id</text>
<text x="1300" y="621" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">source_meal_order_id INT NULL</text>
<text x="1300" y="655" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">requested_amount / status</text>
<rect x="75" y="785" width="535" height="260" rx="8" fill="#FFFFFF" stroke="#4F6F8F" stroke-width="3"/>
<rect x="75" y="785" width="535" height="48" fill="#173B63"/>
<text x="87" y="816" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">CreditNote</text>
<text x="90" y="868" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK credit_note_id INT</text>
<text x="90" y="902" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">FK invoice_id / folio_item_id</text>
<text x="90" y="936" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">FK adjustment_request_id</text>
<text x="90" y="970" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">refund_amount DECIMAL</text>
<rect x="680" y="785" width="535" height="260" rx="8" fill="#FFFFFF" stroke="#4F6F8F" stroke-width="3"/>
<rect x="680" y="785" width="535" height="48" fill="#173B63"/>
<text x="692" y="816" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">MealOrder (M4)</text>
<text x="695" y="868" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK meal_order_id INT</text>
<text x="695" y="902" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">M4-owned source order</text>
<rect x="1285" y="785" width="535" height="260" rx="8" fill="#FFFFFF" stroke="#4F6F8F" stroke-width="3"/>
<rect x="1285" y="785" width="535" height="48" fill="#173B63"/>
<text x="1297" y="816" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">SpaSession (M3)</text>
<text x="1300" y="868" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK spa_session_id INT</text>
<text x="1300" y="902" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">M3-owned source session</text>
<rect x="75" y="1080" width="1745" height="160" rx="8" fill="#F8FAFC" stroke="#AAB9C8" stroke-width="2"/>
<text x="95" y="1115" font-family="Arial" font-size="20" font-weight="400" fill="#5C6B78" text-anchor="start">Filtered unique indexes on FolioItem source_meal_order_id and source_spa_session_id are declarations only, not runtime proof. PaymentTransaction</text>
<text x="95" y="1147" font-family="Arial" font-size="20" font-weight="400" fill="#5C6B78" text-anchor="start">is distinct from Folio and Invoice; payment status does not equal checkout completion. M2 retains a duplicate source mapping for</text>
<text x="95" y="1179" font-family="Arial" font-size="20" font-weight="400" fill="#5C6B78" text-anchor="start">PaymentTransaction.</text></svg>