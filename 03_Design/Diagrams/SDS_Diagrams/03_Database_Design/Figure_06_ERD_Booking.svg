<text x="95" y="1115" font-family="Arial" font-size="20" font-weight="400" fill="#5C6B78" text-anchor="start">PhysicalVilla differs from VillaCategory. PhysicalVilla.zone_name is text, not a declared FK to ResortZone. Revision 1.1 assigns booking/deposit</text>
<text x="95" y="1147" font-family="Arial" font-size="20" font-weight="400" fill="#5C6B78" text-anchor="start">rules to M2 and PaymentTransaction ownership to M5; duplicate M2 PaymentTransaction mapping remains source evidence.</text></svg>