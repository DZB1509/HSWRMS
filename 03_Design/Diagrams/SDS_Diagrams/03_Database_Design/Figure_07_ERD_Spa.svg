<text x="87" y="186" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">RetreatBooking (M2)</text>
<text x="90" y="238" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK retreat_booking_id INT</text>
<text x="90" y="272" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">stay anchor FK</text>
<rect x="680" y="155" width="535" height="260" rx="8" fill="#FFFFFF" stroke="#4F6F8F" stroke-width="3"/>
<rect x="680" y="155" width="535" height="48" fill="#173B63"/>
<text x="692" y="186" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">SpaTreatment</text>
<text x="695" y="238" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK treatment_id INT</text>
<text x="695" y="272" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">treatment_name NVARCHAR(150)</text>
<text x="695" y="306" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">duration_minutes INT</text>
<text x="695" y="340" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">base_price DECIMAL(18,2)</text>
<rect x="1285" y="155" width="535" height="260" rx="8" fill="#FFFFFF" stroke="#4F6F8F" stroke-width="3"/>
<rect x="1285" y="155" width="535" height="48" fill="#173B63"/>
<text x="1297" y="186" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">Therapist</text>
<text x="1300" y="238" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK therapist_id INT</text>
<text x="1300" y="272" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">FK user_id INT</text>
<text x="1300" y="306" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">therapist_status CHECK</text>
<rect x="75" y="470" width="535" height="260" rx="8" fill="#FFFFFF" stroke="#4F6F8F" stroke-width="3"/>
<rect x="75" y="470" width="535" height="48" fill="#173B63"/>
<text x="87" y="501" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">TreatmentRoom</text>
<text x="90" y="553" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK room_id INT</text>
<text x="90" y="587" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">room_status CHECK</text>
<rect x="680" y="470" width="535" height="260" rx="8" fill="#FFFFFF" stroke="#4F6F8F" stroke-width="3"/>
<rect x="680" y="470" width="535" height="48" fill="#173B63"/>
<text x="692" y="501" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">TherapistTreatmentQualification</text>
<text x="695" y="553" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK/FK therapist_id INT</text>
<text x="695" y="587" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK/FK treatment_id INT</text>
<rect x="1285" y="470" width="535" height="260" rx="8" fill="#FFFFFF" stroke="#4F6F8F" stroke-width="3"/>
<rect x="1285" y="470" width="535" height="48" fill="#173B63"/>
<text x="1297" y="501" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">TreatmentRoomCompatibility</text>
<text x="1300" y="553" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK/FK room_id INT</text>
<text x="1300" y="587" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK/FK treatment_id INT</text>
<rect x="75" y="785" width="535" height="260" rx="8" fill="#FFFFFF" stroke="#4F6F8F" stroke-width="3"/>
<rect x="75" y="785" width="535" height="48" fill="#173B63"/>
<text x="87" y="816" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">SpaSession</text>
<text x="90" y="868" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK spa_session_id BIGINT</text>
<text x="90" y="902" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">FK booking/treatment/therapist/room</text>
<text x="90" y="936" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">scheduled_start/end DATETIME2</text>
<text x="90" y="970" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">session + confirmation status</text>
<rect x="680" y="785" width="535" height="260" rx="8" fill="#FFFFFF" stroke="#4F6F8F" stroke-width="3"/>
<rect x="680" y="785" width="535" height="48" fill="#173B63"/>
<text x="692" y="816" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">SpaScheduleHistory</text>
<text x="695" y="868" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK history_id BIGINT</text>
<text x="695" y="902" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">FK session_id BIGINT</text>
<rect x="1285" y="785" width="535" height="260" rx="8" fill="#FFFFFF" stroke="#4F6F8F" stroke-width="3"/>
<rect x="1285" y="785" width="535" height="48" fill="#173B63"/>
<text x="1297" y="816" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">SpaDispatchOutbox</text>
<text x="1300" y="868" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK outbox_id BIGINT</text>
<text x="1300" y="902" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">FK session_id BIGINT</text>
<text x="1300" y="936" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">status / retry_count</text>
<rect x="75" y="1080" width="1745" height="160" rx="8" fill="#F8FAFC" stroke="#AAB9C8" stroke-width="2"/>
<text x="95" y="1115" font-family="Arial" font-size="20" font-weight="400" fill="#5C6B78" text-anchor="start">The qualification and room compatibility join tables are explicit. Candidate generation is read-only; reservation revalidates source rules. The</text>
<text x="95" y="1147" font-family="Arial" font-size="20" font-weight="400" fill="#5C6B78" text-anchor="start">two history/outbox CREATE declarations are guarded in schema.sql. SQL Server concurrency, scheduler behavior and provider delivery are not</text>
<text x="95" y="1179" font-family="Arial" font-size="20" font-weight="400" fill="#5C6B78" text-anchor="start">verified.</text></svg>