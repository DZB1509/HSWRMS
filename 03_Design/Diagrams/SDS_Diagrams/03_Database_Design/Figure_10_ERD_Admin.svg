<text x="1300" y="272" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK/FK permission_id INT</text>
<rect x="75" y="470" width="535" height="260" rx="8" fill="#FFFFFF" stroke="#4F6F8F" stroke-width="3"/>
<rect x="75" y="470" width="535" height="48" fill="#173B63"/>
<text x="87" y="501" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">SystemConfiguration</text>
<text x="90" y="553" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK configuration_id INT</text>
<text x="90" y="587" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">configuration_key NVARCHAR(120)</text>
<text x="90" y="621" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">updated_by_user_id INT NULL</text>
<text x="90" y="655" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">manager_editable BIT</text>
<rect x="680" y="470" width="535" height="260" rx="8" fill="#FFFFFF" stroke="#4F6F8F" stroke-width="3"/>
<rect x="680" y="470" width="535" height="48" fill="#173B63"/>
<text x="692" y="501" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">RightDelegation</text>
<text x="695" y="553" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK delegation_id INT</text>
<text x="695" y="587" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">FK grantor/manager User IDs</text>
<text x="695" y="621" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">valid_from / valid_until DATETIME2</text>
<text x="695" y="655" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">delegation_status CHECK</text>
