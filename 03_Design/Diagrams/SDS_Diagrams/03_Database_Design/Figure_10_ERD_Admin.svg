<text x="1300" y="553" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK/FK delegation_id INT</text>
<text x="1300" y="587" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK/FK permission_id INT</text>
<rect x="75" y="785" width="535" height="260" rx="8" fill="#FFFFFF" stroke="#4F6F8F" stroke-width="3"/>
<rect x="75" y="785" width="535" height="48" fill="#173B63"/>
<text x="87" y="816" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">AuditLog</text>
<text x="90" y="868" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK audit_log_id BIGINT</text>
<text x="90" y="902" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">FK actor_user_id INT NULL</text>
<text x="90" y="936" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">FK delegation_id INT NULL</text>
<text x="90" y="970" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">created_at DATETIME2</text>
<rect x="75" y="1080" width="1745" height="160" rx="8" fill="#F8FAFC" stroke="#AAB9C8" stroke-width="2"/>
<text x="95" y="1115" font-family="Arial" font-size="20" font-weight="400" fill="#5C6B78" text-anchor="start">DDL includes delegation validity interval, status, revocation fields and scoped permissions. Actor/delegation references on AuditLog are</text>
<text x="95" y="1147" font-family="Arial" font-size="20" font-weight="400" fill="#5C6B78" text-anchor="start">nullable. These declarations do not establish runtime authorization coverage, immutable audit operations or formal organizational approval.</text></svg>