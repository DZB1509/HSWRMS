<rect x="75" y="155" width="535" height="260" rx="8" fill="#FFFFFF" stroke="#4F6F8F" stroke-width="3"/>
<rect x="75" y="155" width="535" height="48" fill="#173B63"/>
<text x="87" y="186" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">User</text>
<text x="90" y="238" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK user_id INT</text>
<text x="90" y="272" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">email NVARCHAR(255) NOT NULL</text>
<text x="90" y="306" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">account_status VARCHAR(20)</text>
<text x="90" y="340" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">email_verified BIT</text>
<rect x="680" y="155" width="535" height="260" rx="8" fill="#FFFFFF" stroke="#4F6F8F" stroke-width="3"/>
<rect x="680" y="155" width="535" height="48" fill="#173B63"/>
<text x="692" y="186" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">AuthIdentity</text>
<text x="695" y="238" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK auth_identity_id INT</text>
<text x="695" y="272" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">FK user_id INT NOT NULL</text>
<text x="695" y="306" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">provider VARCHAR(30)</text>
<text x="695" y="340" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">UNIQUE(provider, provider_subject)</text>
<rect x="1285" y="155" width="535" height="260" rx="8" fill="#FFFFFF" stroke="#4F6F8F" stroke-width="3"/>
<rect x="1285" y="155" width="535" height="48" fill="#173B63"/>
<text x="1297" y="186" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">Role</text>
<text x="1300" y="238" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK role_id INT</text>
<text x="1300" y="272" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">role_name NVARCHAR(50)</text>
<rect x="75" y="470" width="535" height="260" rx="8" fill="#FFFFFF" stroke="#4F6F8F" stroke-width="3"/>
<rect x="75" y="470" width="535" height="48" fill="#173B63"/>
<text x="87" y="501" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">UserRole</text>
<text x="90" y="553" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK/FK user_id INT</text>
<text x="90" y="587" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK/FK role_id INT</text>
<text x="90" y="621" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">assigned_at DATETIME2</text>
<rect x="680" y="470" width="535" height="260" rx="8" fill="#FFFFFF" stroke="#4F6F8F" stroke-width="3"/>
<rect x="680" y="470" width="535" height="48" fill="#173B63"/>
<text x="692" y="501" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">CustomerProfile</text>
<text x="695" y="553" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK customer_profile_id INT</text>
<text x="695" y="587" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">FK user_id INT NOT NULL</text>
<text x="695" y="621" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">date_of_birth DATE NULL</text>
<rect x="1285" y="470" width="535" height="260" rx="8" fill="#FFFFFF" stroke="#4F6F8F" stroke-width="3"/>
<rect x="1285" y="470" width="535" height="48" fill="#173B63"/>
<text x="1297" y="501" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">HealthProfile</text>
<text x="1300" y="553" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK health_profile_id INT</text>
<text x="1300" y="587" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">FK customer_profile_id INT</text>
<text x="1300" y="621" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">health/diet fields NULL</text>
<rect x="75" y="785" width="535" height="260" rx="8" fill="#FFFFFF" stroke="#4F6F8F" stroke-width="3"/>
<rect x="75" y="785" width="535" height="48" fill="#173B63"/>
<text x="87" y="816" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">ConsentRecord</text>
<text x="90" y="868" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK consent_id INT</text>
<text x="90" y="902" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">FK user_id INT</text>
<text x="90" y="936" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">consent_status CHECK</text>
<rect x="680" y="785" width="535" height="260" rx="8" fill="#FFFFFF" stroke="#4F6F8F" stroke-width="3"/>
<rect x="680" y="785" width="535" height="48" fill="#173B63"/>
<text x="692" y="816" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">HealthDataDeletionRequest</text>
<text x="695" y="868" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">PK deletion_request_id INT</text>
<text x="695" y="902" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">FK customer_profile_id INT</text>
<text x="695" y="936" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">FK health_profile_id INT NULL</text>
<text x="695" y="970" font-family="Arial" font-size="24" font-weight="400" fill="#203040" text-anchor="start">request_status CHECK</text>
<rect x="75" y="1080" width="1745" height="160" rx="8" fill="#F8FAFC" stroke="#AAB9C8" stroke-width="2"/>
<text x="95" y="1115" font-family="Arial" font-size="20" font-weight="400" fill="#5C6B78" text-anchor="start">UserRole is the explicit many-to-many join for User and Role. Deletion request health_profile_id is nullable. Multiplicities show FK cardinality</text>
<text x="95" y="1147" font-family="Arial" font-size="20" font-weight="400" fill="#5C6B78" text-anchor="start">and do not infer uniqueness absent a declared constraint. Privacy retention and runtime field authorization remain unverified.</text></svg>