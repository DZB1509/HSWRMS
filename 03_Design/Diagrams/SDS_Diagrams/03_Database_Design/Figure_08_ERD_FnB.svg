<text x="95" y="1115" font-family="Arial" font-size="20" font-weight="400" fill="#5C6B78" text-anchor="start">MenuItemIngredient is the recipe join. IngredientBatch declares expiry and usable quantity columns. Schema constraints do not prove deployed</text>
<text x="95" y="1147" font-family="Arial" font-size="20" font-weight="400" fill="#5C6B78" text-anchor="start">inventory behavior. Entitlement enforcement and service-location policy remain unverified.</text></svg>