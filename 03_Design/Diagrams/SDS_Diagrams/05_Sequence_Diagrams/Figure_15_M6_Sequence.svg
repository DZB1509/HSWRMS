  <rect x="70" y="1060" width="1460" height="88" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="88" y="1085" font-family="Arial" font-size="15" fill="#000000">Evidence boundary: Create validates the active Manager, dates and delegable permissions; revoke permits only Active/Pending delegations. Selected outcomes are audited.</text>
  <text x="88" y="1110" font-family="Arial" font-size="15" fill="#000000">The requests are separate operations. Scheduler execution, deployed authorization and SQL Server behavior are not verified.</text>
  <text x="70" y="1176" font-family="Arial" font-size="14" fill="#000000">Solid arrow: source-backed request/call. Dashed arrow: response/return. Static source review only.</text>
