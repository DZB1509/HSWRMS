  <text x="632" y="782" text-anchor="middle" font-family="Arial" font-size="19" font-weight="400" fill="#000000">FinalizeCheckoutResponseDTO</text>
  <line x1="465" y1="860" x2="130" y2="860" stroke="#000000" stroke-width="1.5" stroke-dasharray="12 8" marker-end="url(#arrow)" />
  <rect x="223" y="831" width="148" height="25" fill="#ffffff" />
  <text x="297" y="852" text-anchor="middle" font-family="Arial" font-size="19" font-weight="400" fill="#000000">checkout result</text>
  <rect x="70" y="960" width="1460" height="105" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="92" y="993" text-anchor="start" font-family="Arial" font-size="18" font-weight="400" fill="#000000">Separate VNPay flow: create-payment-url persists PaymentTransaction=PENDING; verify-return processes callback.</text>
  <text x="92" y="1013" text-anchor="start" font-family="Arial" font-size="18" font-weight="400" fill="#000000">Successful confirmation may set PaymentTransaction=SUCCESSFUL; if Invoice becomes PAID and guard passes, Folio/Booking close.</text>
  <text x="92" y="1033" text-anchor="start" font-family="Arial" font-size="18" font-weight="400" fill="#000000">Otherwise callback does not close the stay; finalize-checkout rejects unpaid balance. Live gateway/SQL Server behavior unverified.</text>
  <rect x="70" y="1080" width="1460" height="85" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="92" y="1111" text-anchor="start" font-family="Arial" font-size="18" font-weight="400" fill="#000000">Legend: solid arrow = observed source request/call; dashed arrow = response/return.</text>
  <text x="92" y="1131" text-anchor="start" font-family="Arial" font-size="18" font-weight="400" fill="#000000">Static source only; runtime, SQL Server/provider behavior, and test execution are not inferred.</text>
</svg>