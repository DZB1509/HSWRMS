  <rect x="1129.0" y="442.0" width="12" height="66.0" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <rect x="1464.0" y="582.0" width="12" height="66.0" fill="#ffffff" stroke="#000000" stroke-width="1" />
