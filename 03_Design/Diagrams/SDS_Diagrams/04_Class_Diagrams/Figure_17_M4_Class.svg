<text x="90" y="1487" font-family="Arial" font-size="17" font-weight="400" fill="#5C6B78" text-anchor="start">KDS M4 invokes idempotent M5 posting for eligible A_LA_CARTE delivery with sourceMealOrderId. The response DTO/null is ignored; thrown errors leave</text>
<text x="90" y="1518" font-family="Arial" font-size="17" font-weight="400" fill="#5C6B78" text-anchor="start">the inspected method before its final M4 save. FnbFolioEventListener is a second caller. Transaction rollback and SQL Server behavior are unverified.</text></svg>