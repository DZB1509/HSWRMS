<text x="90" y="1487" font-family="Arial" font-size="17" font-weight="400" fill="#5C6B78" text-anchor="start">Candidate generation is read-only and is not a reservation. The reservation path revalidates resources. Outbox retry configuration exists in source,</text>
<text x="90" y="1518" font-family="Arial" font-size="17" font-weight="400" fill="#5C6B78" text-anchor="start">but worker scheduling and provider delivery are not runtime-verified. SQL Server locking/concurrency remains unverified; mutual-consent recovery is</text>
<text x="90" y="1549" font-family="Arial" font-size="17" font-weight="400" fill="#5C6B78" text-anchor="start">partial.</text></svg>