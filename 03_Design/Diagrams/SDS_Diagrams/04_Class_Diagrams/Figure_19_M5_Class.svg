<text x="90" y="1487" font-family="Arial" font-size="17" font-weight="400" fill="#5C6B78" text-anchor="start">Folio is mutable; Invoice is a formal snapshot. Charge posting, payment initiation/callback, PaymentTransaction state and checkout completion are</text>
<text x="90" y="1518" font-family="Arial" font-size="17" font-weight="400" fill="#5C6B78" text-anchor="start">distinct. Source-key filtered unique indexes exist in schema.sql; SQL Server enforcement and VNPay operation are not verified. M2 still contains a</text>
<text x="90" y="1549" font-family="Arial" font-size="17" font-weight="400" fill="#5C6B78" text-anchor="start">duplicate PaymentTransaction mapping.</text></svg>