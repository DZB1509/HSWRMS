# Dedicated SQL Server Profile (Externalized Credentials Only)
# Activate with: --spring.profiles.active=sqlserver
# Required environment variables:
#   HSWRMS_DB_URL      (e.g., jdbc:sqlserver://MYLIFE-MYRULE-1:1433;databaseName=HSWRMS_TEST;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true)
#   HSWRMS_DB_USERNAME (e.g., hswrms_test_user)
#   HSWRMS_DB_PASSWORD (supplied securely at runtime; never hardcoded)

spring:
  datasource:
    url: ${HSWRMS_DB_URL:jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:HSWRMS_TEST};encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: ${HSWRMS_DB_USERNAME:${DB_USERNAME:hswrms_app_user}}
    password: ${HSWRMS_DB_PASSWORD:${DB_PASSWORD:}}
    hikari:
      pool-name: HSWRMS-SqlServerPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    generate-ddl: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: false
  sql:
    init:
      mode: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://127.0.0.1:4173}
  seed:
    demo-data: ${SEED_DEMO_DATA:false}
  initializer:
    m6:
      enabled: ${APP_INITIALIZER_M6_ENABLED:false}
    villa-inventory:
      enabled: ${APP_INITIALIZER_VILLA_INVENTORY_ENABLED:false}

logging:
  level:
    com.heavenstay.hswrms: DEBUG
    org.springframework.security: INFO
