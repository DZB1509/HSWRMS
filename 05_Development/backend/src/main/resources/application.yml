server:
  port: 8080

spring:
  application:
    name: hswrms
  profiles:
    default: sqlserver
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=HSWRMS;encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:12345}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: false

  # Spring Mail configuration for SMTP delivery (used when smtp profile is active).
  # All values are externalized via environment variables. Never hardcode credentials.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
          from: ${MAIL_FROM:${MAIL_USERNAME:noreply@heavenstay.com}}

app:
  jwt:
    secret: ${JWT_SECRET:defaultHeavenStayResortSuperSecretKeyForDevelopmentOnlyMustBeAtLeast256BitsLong}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  # Google SSO (S05/S06). Client credentials are read from the environment by
  # SsoClientConfig (GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET) and must NEVER be
  # committed. Redirect URI to register in the Google Cloud Console:
  #   http://localhost:8080/api/v1/auth/sso/callback/google
  sso:
    frontend-base-url: ${SSO_FRONTEND_BASE_URL:http://localhost:5173}
    login-ticket-ttl-ms: 300000
    registration-ticket-ttl-ms: 600000

logging:
  level:
    root: INFO
    com.heavenstay.hswrms: DEBUG
    org.springframework.security: INFO
