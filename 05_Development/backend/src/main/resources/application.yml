server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true

spring:
  application:
    name: hswrms

  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:HSWRMS};encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:123}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: false

app:
  jwt:
    secret: ${JWT_SECRET:defaultHeavenStayResortSuperSecretKeyForDevelopmentOnlyMustBeAtLeast256BitsLong}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  resort:
    timezone: ${RESORT_TIMEZONE:Asia/Ho_Chi_Minh}
  booking:
    deposit-percentage: ${BOOKING_DEPOSIT_PERCENTAGE:30}
    hold-minutes: ${BOOKING_HOLD_MINUTES:15}
    cancellation-window-hours: ${BOOKING_CANCELLATION_WINDOW_HOURS:48}
    refund-percentage: ${BOOKING_REFUND_PERCENTAGE:100}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:HEAVENSTAY}
    hash-secret: ${VNPAY_HASH_SECRET:SECRET_VNPAY_KEY_FOR_DEVELOPMENT_ONLY_HSWRMS}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:5173/customer/booking/deposit-result}

logging:
  level:
    root: INFO
    com.heavenstay.hswrms: DEBUG
    org.springframework.security: INFO
