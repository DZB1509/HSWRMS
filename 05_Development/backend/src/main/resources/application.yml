server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
      force-response: true
      enabled: true

spring:
  application:
    name: hswrms
  profiles:
    default: sqlserver
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:HSWRMS};encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:123}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: false

  # Spring Mail configuration for SMTP delivery (used when smtp profile is active).
  # All values are externalized via environment variables. Never hardcode credentials.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
          from: ${MAIL_FROM:${MAIL_USERNAME:noreply@heavenstay.com}}

app:
  jwt:
    secret: ${JWT_SECRET:defaultHeavenStayResortSuperSecretKeyForDevelopmentOnlyMustBeAtLeast256BitsLong}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

  spa:
    scheduling:
      # Operational parameters configurable by environment.
      # No unapproved business defaults are hard-coded.
      operating-open: ${SPA_OPEN_TIME:}
      operating-close: ${SPA_CLOSE_TIME:}
      alternative-search-days: ${SPA_ALT_DAYS:}

  # Google SSO (S05/S06). Credentials are read from environment variables.
  # Redirect URI: http://localhost:8080/api/v1/auth/sso/callback/google
  sso:
    frontend-base-url: ${SSO_FRONTEND_BASE_URL:http://localhost:5173}
    login-ticket-ttl-ms: 300000
    registration-ticket-ttl-ms: 600000
    # Facebook LINK ticket TTL must cover the 10-minute OTP issued alongside it
    # (AuthService.sendFacebookLinkOtp). A shorter ticket TTL expired the ticket
    # before the user finished entering a still-valid OTP → "sign-in request has
    # expired". Aligned to the OTP validity window (10 min).
    link-ticket-ttl-ms: 600000

  billing:
    # VAT applied to chargeable extras (Spa / F&B). Typical values: 0.08 or 0.10
    vat-rate: ${BILLING_VAT_RATE:0.08}

  # VNPay Gateway Configuration for M2 retreat booking deposit & M5 billing.
  # Values default to empty/placeholder and are externalized via environment variables.
  # If VNPAY_HASH_SECRET is not provided, the gateway safely refuses payment generation.
  # Never hardcode production secrets into source control.
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:HEAVENSTAY}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    mock-auto-confirm: ${VNPAY_MOCK_AUTO_CONFIRM:false}

  seed:
    # Seeds the Eleanor Vance demo stay. Keep false outside local demos.
    demo-data: ${SEED_DEMO_DATA:false}

logging:
  level:
    root: INFO
    com.heavenstay.hswrms: DEBUG
    org.springframework.security: INFO
