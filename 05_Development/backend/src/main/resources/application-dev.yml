# Local Developer Override Profile
# Run with: --spring.profiles.active=dev

logging:
  level:
    com.heavenstay.hswrms: DEBUG
    org.springframework.security: DEBUG

---
# Dedicated SQL Server datasource for dev profile.
# Activates when dev profile is active.
spring:
  config:
    activate:
      on-profile: "dev & !local"
  datasource:
    url: ${HSWRMS_DB_URL:jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:HSWRMS_TEST};encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true}
    username: ${HSWRMS_DB_USERNAME:${DB_USERNAME:hswrms_app_user}}
    password: ${HSWRMS_DB_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: none
    naming:
      physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:4173
