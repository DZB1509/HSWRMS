# Local Developer Override Profile
# Run with: --spring.profiles.active=dev

spring:
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=HSWRMS;encrypt=true;trustServerCertificate=true
    username: sa
    password: 123
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.heavenstay.hswrms: DEBUG
    org.springframework.security: DEBUG
