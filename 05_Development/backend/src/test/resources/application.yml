spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MSSQLServer;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS DBO
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false

app:
  jwt:
    secret: defaultHeavenStayResortSuperSecretKeyForDevelopmentOnlyMustBeAtLeast256BitsLong
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173
  spa:
    scheduling:
      # Test operating window for automated scheduling verification
      operating-open: "08:00"
      operating-close: "20:00"
  billing:
    vat-rate: 0.08
  vnpay:
    hash-secret: test-vnpay-secret
    mock-auto-confirm: false
  seed:
    demo-data: false
