spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS dbo
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  jwt:
    secret: defaultHeavenStayResortSuperSecretKeyForDevelopmentOnlyMustBeAtLeast256BitsLong
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173
  billing:
    vat-rate: 0.08
  vnpay:
    hash-secret: test-vnpay-secret
    mock-auto-confirm: true
  seed:
    demo-data: true
